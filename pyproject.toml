[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fukakusa-ocr"
version = "1.0.0"
description = "Fukakusa OCR: ViT-B/16 jibo classifier, character detectors and page reader for classical Japanese manuscripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "transformers>=4.40", "safetensors>=0.4", "pillow>=9.0", "numpy>=1.24"]

[project.optional-dependencies]
page = ["ultralytics>=8.2"]

[project.scripts]
fukakusa-ocr = "fukakusa_ocr.cli:main"

[tool.setuptools]
packages = ["fukakusa_ocr"]
